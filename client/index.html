<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Аукцион Душ</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>Аукцион Душ</h1>
  <div id="status-bar">
    <span id="round-label">Раунд: —</span>
    <span id="phase-label">Фаза: —</span>
  </div>
</header>
<main>
  <section id="connect-screen" class="panel">
    <h2>Вход в игру</h2>
    <p class="hint">Введите имя и войдите в комнату. Максимум — 4 игрока.</p>
    <label>
      Имя:
      <input id="name-input" maxlength="20" placeholder="Ваше имя" autocomplete="off">
    </label>
    <button id="connect-btn" class="primary">Войти в комнату</button>
    <p id="connect-msg" class="msg"></p>
  </section>

  <section id="game-screen" hidden>
    <div class="panel" id="item-panel">
      <h2>Лот раунда</h2>
      <div id="item-card" class="hidden">
        <h3 id="item-name">—</h3>
        <p id="item-desc"></p>
      </div>
      <div id="action-panel" class="hidden">
        <h3 id="action-title">Выберите цель:</h3>
        <div id="target-list"></div>
        <p class="hint">У вас 10 секунд, иначе сервер выберет цель сам.</p>
      </div>
    </div>

    <div class="panel" id="players-panel">
      <h2>Игроки в комнате</h2>
      <table>
        <thead>
          <tr>
            <th>Игрок</th><th>HP</th><th>Души</th><th>Броня</th><th>Статус</th>
          </tr>
        </thead>
        <tbody id="players-table"></tbody>
      </table>
      <div id="lobby-controls">
        <button id="ready-btn" class="primary">Я готов</button>
        <span id="lobby-hint" class="hint"></span>
      </div>
    </div>

    <div class="panel" id="bet-panel">
      <h2>Ваша ставка</h2>
      <div class="bet-row">
        <input type="range" id="bet-range" min="0" max="10" step="1" value="0">
        <input type="number" id="bet-input" min="0" max="10" step="1" value="0">
        <button id="bet-btn" class="primary">Поставить</button>
      </div>
      <p id="bet-msg" class="msg"></p>
    </div>

    <div class="panel hidden" id="gameover-panel">
      <h2 id="gameover-title">Игра окончена</h2>
      <button id="restart-btn" class="primary">Новая партия</button>
    </div>

    <div class="panel" id="log-panel">
      <h2>Журнал событий</h2>
      <ul id="log"></ul>
    </div>
  </section>
</main>
<script src="/sdk/colyseus.js"></script>
<script src="/client.js" defer></script>
</body>
</html>
